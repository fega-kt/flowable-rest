services:
  flowable:
    # Build từ Dockerfile trong flowable-server/ thay vì dùng image đóng hộp.
    # Điều này cho phép thêm JavaDelegate/TaskListener Spring Bean tuỳ chỉnh.
    build:
      context: ./flowable-server
      dockerfile: Dockerfile
    # image: flowable/flowable-rest:7.0.0  # giữ lại để fallback nếu cần

    ports:
      - "8080:8080"

    environment:
      # --- Database (Supabase PostgreSQL) ---
      SPRING_DATASOURCE_URL: ${SUPABASE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SUPABASE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SUPABASE_DB_PASSWORD}

      # --- Flowable schema/config ---
      FLOWABLE_DATABASE_SCHEMA: flowable
      FLOWABLE_DATABASE_SCHEMA_UPDATE: "true"

      # --- Admin user cho Flowable REST API ---
      FLOWABLE_REST_APP_ADMIN_USER_ID: ${FLOWABLE_ADMIN_USER:-admin}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:-admin}
      FLOWABLE_REST_APP_ADMIN_EMAIL: ${FLOWABLE_ADMIN_EMAIL:-admin@example.com}

      # --- Callback NestJS (JavaDelegate/TaskListener gọi ngược) ---
      # Trong Docker Compose: "nestjs" là tên service NestJS trong cùng compose file.
      # Trong K8s: dùng ClusterIP service name, ví dụ: http://nestjs-approval-svc:3000
      NESTJS_INTERNAL_BASE_URL: ${NESTJS_INTERNAL_BASE_URL:-http://nestjs:3000}

      # --- Shared secret giữa Flowable và NestJS (dùng trong X-Internal-Auth header) ---
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-u",
          "${FLOWABLE_ADMIN_USER:-admin}:${FLOWABLE_ADMIN_PASSWORD:-admin}",
          "http://localhost:8080/flowable-rest/service/repository/deployments",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
